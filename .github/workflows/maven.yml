name: Backend CI Maven

on:
  pull_request:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Atualizar código
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'oracle' 
        java-version: '17'

    - name: Verificar versões
      run: |
        mvn --version
        java -version


    - name : Configurar projeto
      run: |
        cd projeto-volt
        mvn -B package -DskipTests

    # - name: Gerar artefato
    #   uses: actions/upload-artifact@v4
    #   with:
    #      name: projeto-volt
    #      path: projeto-volt/target/*jar

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Verificar código
        uses: actions/checkout@v4

      -  name: Configurar Java 17
         uses: actions/setup-java@v4
         with:
           distribution: 'oracle'
           java-version: '17'

      -  name: Testar projeto
         run: |
           cd projeto-volt/src/test/java
           mvn test

  deploy:
      needs: build
      runs-on: ubuntu-latest

      steps:
          - name: Recuperar artefato do build
            uses: actions/download-artifact@v4
            with:
               name: projeto-volt
               path: projeto-volt/target/*jar

          - name: Verificar arquivos baixados
            run: |
              ls -la
              cd projeto-volt/target
              ls -la
             
          - name: Compactar artefato
            run: |
              cd projeto-volt/target
              tar -czf projeto-volt.tar.gz *jar
         
