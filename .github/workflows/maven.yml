name: Backend CI Maven

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Atualizar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle' 
          java-version: '17'

      - name: Verificar versões
        run: |
          mvn --version
          java -version

      - name: Configurar projeto
        run: |
          cd projeto-volt
          mvn -B package -DskipTests
          mvn package

      - name: Gerar artefato
        uses: actions/upload-artifact@v4
        with: 
          name: projeto-volt
          path: projeto-volt/target/*jar

      - name: Gerar artefato Github com os arquivos .sh
        uses: actions/upload-artifact@v4        
        with:
          name: scripts  # nome do arquivo ou conjunto de arquivos (veja ele depois em 'Recuperar scripts')
          path: .github/scripts/*.sh 

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Verificar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '17'

      - name: Testar projeto
        run: |
          cd projeto-volt
          mvn test        
          
  deploy:
    needs: test  
    runs-on: ubuntu-latest
    steps:
      - name: Recuperar artefato do build
        uses: actions/download-artifact@v4
        with:
          name: projeto-volt
          path: projeto-volt/target/*jar

      - name: Recuperar scripts
        uses: actions/download-artifact@v4
        with:
          name: scripts
          path: ./     

      - name: Verificar arquivos baixados
        run: |
          ls -la
          cd projeto-volt/target
          ls -la
             
      - name: Compactar artefato
        run: |
          cd projeto-volt/target
          tar -czf projeto-volt.tar.gz *jar

      - name: Configurar arquivo .PEM
        id: geracao-arquivo-pem 
        run: |
          echo "${{ secrets.EC2_PUBLIC_KEY }}" >> $HOME/${{ secrets.NOME_ARQUIVO_PEM_PUB }}
          chmod 400 $HOME/${{ secrets.NOME_ARQUIVO_PEM_PUB }}

      - name: Enviar o JAR para EC2
        uses: appleboy/scp-action@master # esta action abstrai o uso do comando scp, permitindo o envio de arquivos via ssh
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }} # ip da ec2 pública
          username: ubuntu
          key: ${{ secrets.NOME_ARQUIVO_PEM_PUB}} # conteúdo pem que permite acesso à ec2 pública
          source: "projeto-volt/target/*jar" # enviando todos os .jar (estão lá graças ao step 'Recuperar jars')
          target: "/home/ubuntu/deploy-api/" # diretório de destino na ec2 pública

      - name: Enviar os Scripts para EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.NOME_ARQUIVO_PEM_PUB }}
          source: "./*.sh"  # enviando todos os .jar (estão lá graças ao step 'Recuperar scripts')
          target: "/home/ubuntu/deploy-api/" # diretório de destino na ec2 pública

      - name: Conectar com EC2 e executar o script
        run: |
          ssh -o StrictHostKeyChecking=no -i $HOME/${{ secrets.EC2_PUBLIC_KEY }} ubuntu@${{ secrets.EC2_PUBLIC_IP}} '
          scp -i ${{ secrets.NOME_ARQUIVO_PEM_PUB  }} deploy-api/${{ secrets.NOME_ARQUIVO_JAR }} ubuntu@${{ secrets.EC2_PRIVATE_IP }}:/home/ubuntu/deploy-api
          scp -i ${{ secrets.NOME_ARQUIVO_PEM_PUB  }} deploy-api/*.sh ubuntu@${{ secrets.EC2_PRIVATE_IP}}:/home/ubuntu/deploy-api
          ssh -i ${{ secrets.NOME_ARQUIVO_PEM_PUB  }} ubuntu@${{ secrets.EC2_PRIVATE_IP }} "sh /home/ubuntu/deploy-api/api-restart.sh"            
