name: Backend CI Maven

on:
  pull_request:
    branches: [ "desenvolvimento" ]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Atualizar código
      uses: actions/checkout@v4

    - name: Travar versão do Java
      uses: actions/setup-java@v4
      with:
        distribution: 'corretto' 
        java-version: '17'


    - name : Baixar dependências
      run: mvn --batch-mode --update-snapshots verify

    - name: Validar criação do maven
    - run: mkdir staging && cp target/*.jar staging
    - uses: actions/upload-artifact@v4
      with:
        name: Package
        path: staging

    
    # - name: Gerar artefato Github com os arquivos de build
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: projeto-volt
    #     path: projeto-volt/target/*jar

    
    
      
  deploy:
      needs: build
      runs-on: ubuntu-latest

      steps:
          - name: Recuperar artefato do build
            uses: actions/download-artifact@v4
            with:
               name: projeto-volt
               path: projeto-volt/target/*jar
            
         
