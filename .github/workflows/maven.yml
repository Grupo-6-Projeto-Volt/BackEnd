name: Backend CI Maven

on:
  pull_request:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Atualizar código
      uses: actions/checkout@v4

    - name: Travar versão do Java
      uses: actions/setup-java@v4
      with:
        distribution: 'corretto' 
        java-version: '17'

    - name : Baixar dependências
      run: | 
        cd projeto-volt
        mvn -B package --file pom.xml

    - name: Grafico de dependência
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
        
    # - name: Gerar artefato Github com os arquivos de build
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: projeto-volt
    #     path: projeto-volt/target/*jar

    
    
      
  deploy:
      needs: build
      runs-on: ubuntu-latest

      steps:
          - name: Recuperar artefato do build
            uses: actions/download-artifact@v4
            with:
               name: projeto-volt
               path: projeto-volt/target/*jar
            
         
