name: Backend CI Maven

on:
  pull_request:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Atualizar código
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'oracle' 
        java-version: '17'

    - name: Verificar versões
      run: |
        mvn --version
        java -version


    - name : Configurar projeto
      run: |
        cd projeto-volt
        mvn -B package --file pom.xml

    - name: Gerar artefato
      uses: actions/upload-artifact@v4
      with:
         name: projeto-volt
         path: projeto-volt/target/*jar

  deploy:
      needs: build
      runs-on: ubuntu-latest

      steps:
          - name: Recuperar artefato do build
            uses: actions/download-artifact@v4
            with:
               name: projeto-volt
               path: projeto-volt/target/*jar

          - name: Compactar artefato
            run: |
             ls -la
             cd projeto-volt
             ls -la
             cd target
             tar -czf projeto-volt.tar.gz build
         
