name: Backend CI Maven

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Atualizar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle' 
          java-version: '17'

      - name: Verificar versões
        run: |
          mvn --version
          java -version

      - name: Configurar projeto
        run: |
          cd projeto-volt
          mvn -B package -DskipTests
          mvn package

      - name: Gerar artefato
        uses: actions/upload-artifact@v4
        with: 
          name: projeto-volt
          path: projeto-volt/target/*jar

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Verificar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '17'

      - name: Testar projeto
        run: |
          cd projeto-volt
          mvn test        
          
  deploy:
    needs: test  
    runs-on: ubuntu-latest
    steps:
      - name: Recuperar artefato do build
        uses: actions/download-artifact@v4
        with:
          name: projeto-volt
          path: projeto-volt/target/*jar

      - name: Verificar arquivos baixados
        run: |
          ls -la
          cd projeto-volt/target
          ls -la
             
      - name: Compactar artefato
        run: |
          cd projeto-volt/target
          tar -czf projeto-volt.tar.gz *jar

      - name: Configurar arquivo .PEM
        id: geracao-arquivo-pem 
        run: |
          echo "${{ secrets.DEPLOY_KEY }}" >> $HOME/${{ secrets.NOME_ARQUIVO_PEM }}
          chmod 400 $HOME/${{ secrets.NOME_ARQUIVO_PEM }}
      - name: Criar diretório no servidor remoto
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_PRIVATE_IP }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            sudo chown -R ubuntu:ubuntu /var/www
            sudo mkdir -p /var/www/backend/
            sudo chown -R ubuntu:ubuntu /var/www/backend/

      - name: Deploy para EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_PRIVATE_IP }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: projeto-volt.tar.gz
          target: /var/www/backend/
          timeout : "120s"
        
      - name: Criar diretório no servidor remoto
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_PRIVATE_IP }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /var/www/backend/
            tar -xzf projeto-volt.tar.gz
