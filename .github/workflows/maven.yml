name: Backend CI Maven

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Atualizar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle' 
          java-version: '17'

      - name: Verificar versões
        run: |
          mvn --version
          java -version

      - name: Configurar projeto
        run: |
          cd projeto-volt
          mvn -B package -DskipTests

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Verificar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '17'

      - name: Testar projeto
        run: |
          cd projeto-volt
          mvn test

      - name: veficar jar
        run: |
          cd projeto-volt/target
          ls -la
           if [ -f projeto-volt/target/*.jar ]; then
              echo "Arquivo jar encontrado"
          else
              echo "Erro: Nenhum arquivo .jar encontrado em projeto-volt/target/"
              exit 1
          fi

      - name: Gerar artefato se encontrar jar
        uses: actions/upload-artifact@v4
        with: 
          name: projeto-volt
          path: projeto-volt/target/*jar
          
          
  deploy:
    needs: test  
    runs-on: ubuntu-latest
    steps:
      - name: Recuperar artefato do build
        uses: actions/download-artifact@v4
        with:
          name: projeto-volt
          path: projeto-volt/target/*jar

      - name: Verificar arquivos baixados
        run: |
          ls -la
          cd projeto-volt/target
          ls -la
             
      - name: Compactar artefato
        run: |
          cd projeto-volt/target
          tar -czf projeto-volt.tar.gz *jar
